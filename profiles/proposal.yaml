# Profil dokumentu: nabídka na základě poptávky.
# Váhy kritérií uvnitř skupiny B (obecná kvalita) dávají součet 1, lze je upravit.
name: Nabídka
document_type: nabídka
structure_instructions: |
  Doporučená osnova nabídky (přizpůsobte konkrétní poptávce):
  1. Manažerské shrnutí.
  2. Tabulka „požadavek poptávky -> kde v nabídce“.
  3. Cíle plnění.
  4. Metodika a etapy; ke každé etapě výstupy a kritéria převzetí.
  5. Harmonogram s milníky.
  6. Cena a pracnost po etapách.
  7. Součinnost zadavatele.
  8. Předpoklady a omezení.
  9. Tým a reference.
criteria:
  - id: B1
    name: Konkrétnost
    description: >-
      Nabídka obsahuje konkrétní návrh realizace, ne obecná ujištění o schopnostech
      dodavatele (výslovný požadavek poptávky).
    weight: 0.25
  - id: B2
    name: Ověřitelnost výstupů
    description: >-
      Každá etapa má jasně popsaný výstup a kritérium převzetí, podle kterého lze
      splnění ověřit.
    weight: 0.20
  - id: B3
    name: Vnitřní konzistence
    description: >-
      Cena odpovídá pracnosti krát sazba, harmonogram odpovídá etapám a odkazy
      na kapitoly sedí.
    weight: 0.20
  - id: B4
    name: Srozumitelnost pro zadavatele
    description: >-
      Přehledná struktura, manažerské shrnutí a snadná dohledatelnost požadavků
      (např. tabulka „požadavek -> kde v nabídce“).
    weight: 0.15
  - id: B5
    name: Hranice a rizika
    description: >-
      Nabídka uvádí předpoklady, omezení a to, co plnění není.
    weight: 0.10
  - id: B6
    name: Jazyk a forma
    description: >-
      Spisovná čeština, profesní tón a přiměřený rozsah.
    weight: 0.10
