# Nastavení nástroje (modely, smyčka, váhy skupin kritérií, ceny).
models:
  # subscription = Claude Code (předplatné Max) a Codex CLI (předplatné ChatGPT), bez API klíčů;
  # api = placené API s klíči v .env (oddíly claude a gpt níže).
  mode: subscription
  # Modely a effort pro režim subscription. Volitelné "command" (cesta k programu claude, resp. codex,
  # když není v PATH) se zadává u claude nebo codex, např. codex: {command: "C:/nastroje/codex.exe"}.
  subscription:
    claude: {model: claude-opus-5-5, effort: high, extraction_effort: medium}
    codex: {model: gpt-6-astra, effort: high}
  # Oddíly claude a gpt níže platí jen pro mode: api.
  # Claude píše a zapracovává text; effort řídí hloubku uvažování
  # (low, medium, high, xhigh, max). Do max_tokens_* se počítá i uvažování modelu,
  # proto jsou limity vysoké; při hlášce o uříznuté odpovědi je zvyšte.
  claude: {model: claude-opus-5-5, effort: high, extraction_effort: medium,
           max_tokens_text: 64000, max_tokens_json: 32000, fallback: true}
  # GPT je nezávislý hodnotitel. Do max_output_tokens se počítají i tokeny uvažování
  # (reasoning), proto je limit vysoký; při hlášce o uříznuté odpovědi ho zvyšte.
  gpt: {model: gpt-6-astra, effort: high, max_output_tokens: 64000}
  max_retries: 4      # počet opakování při dočasné chybě API (jen API; CLI opakují dočasné chyby samy)
  # Časový limit jednoho volání v sekundách. Hodnocení s vysokým effortem trvá i desítky
  # minut, proto je limit dlouhý.
  timeout_s: 1800
# Řízení smyčky:
#   target_score   – cílové celkové skóre (0–10),
#   max_revisions     – nejvyšší počet revizí (zapracování),
#   min_requirement_score – minimální skóre každé povinné náležitosti, aby byl cíl splněn,
#   max_suggestions     – nejvyšší počet návrhů, které smí hodnotitel v jednom hodnocení podat.
loop: {target_score: 9.5, max_revisions: 3, min_requirement_score: 8, max_suggestions: 10}
# Váhy skupin: A povinné náležitosti, B obecná kvalita, C fakta. Součet musí být 1.
group_weights: {A: 0.50, B: 0.35, C: 0.15}
default_profile: proposal
# Ceny v USD za 1 milion tokenů (pro odhad nákladů běhu).
prices_usd_per_million:
  claude-opus-5-5: {input: 4.0, output: 20.0}
  gpt-6-astra: {input: 10.0, output: 50.0}
