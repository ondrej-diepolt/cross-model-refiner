# Nastavení nástroje (modely, smyčka, váhy skupin kritérií, ceny).
modely:
  # Claude píše a zapracovává text; effort řídí hloubku uvažování.
  claude: {model: claude-opus-5-5, effort: high, effort_extrakce: medium,
           max_tokens_text: 64000, max_tokens_json: 16000, fallback: true}
  # GPT je nezávislý hodnotitel.
  gpt: {model: gpt-6-astra, effort: high, max_output_tokens: 32000}
  max_retries: 4      # počet opakování při dočasné chybě API
  timeout_s: 600      # časový limit jednoho volání v sekundách
# Řízení smyčky: cílové skóre (0-10), max. počet revizí, minimální náležitost
# návrhu k zapracování a maximální počet zapracovaných návrhů v jednom kole.
smycka: {cilove_skore: 9.5, max_revizi: 3, min_nalezitost: 8, max_navrhu: 10}
# Váhy skupin: A povinné náležitosti, B obecná kvalita, C fakta. Součet musí být 1.
vahy_skupin: {A: 0.50, B: 0.35, C: 0.15}
vychozi_profil: nabidka
# Ceny v USD za 1 milion tokenů (pro odhad nákladů běhu).
ceny_usd_za_milion:
  claude-opus-5-5: {vstup: 4.0, vystup: 20.0}
  gpt-6-astra: {vstup: 10.0, vystup: 50.0}
